<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kessler &amp; Voss Automobile · Fahrzeugsuche powered by ALEVO</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;500;600&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
html{overflow-anchor:none}
body{margin:0;background:#F6F4F0;font-family:Manrope,system-ui,sans-serif;color:#16161A}
a{color:#16161A}a:hover{color:#5E5B55}
.alv-in{width:100%;box-sizing:border-box;height:48px;padding:0 14px;border:1px solid #D9DCE3;border-radius:10px;font:500 15px Nunito,sans-serif;color:#0A1628;background:#FFFFFF;outline:none}
.alv-in:focus{border-color:#F0527A;box-shadow:0 0 0 3px rgba(240,82,122,.15)}
.alv-btn{cursor:pointer}
.alv-btn:hover{filter:brightness(1.15)}
.alv-chip{cursor:pointer}
.alv-chip:hover{border-color:#0A1628}
.alv-spin{width:16px;height:16px;border-radius:50%;border:2px solid #E4E6EB;border-top-color:#F0527A;animation:alvspin .8s linear infinite;box-sizing:border-box}
@keyframes alvspin{to{transform:rotate(360deg)}}
.alv-pulse{width:8px;height:8px;border-radius:50%;background:#F0527A;animation:alvpulse 1.6s ease-in-out infinite}
@keyframes alvpulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (max-width: 1180px){
.kv-pad,.kv-bestand{padding-left:40px!important;padding-right:40px!important}
.kv-header,.kv-footer{padding-left:40px!important;padding-right:40px!important}
.kv-hero{flex-direction:column!important;gap:48px!important;min-height:0!important}
.kv-hero-text{padding-top:0!important;flex-basis:auto!important}
.kv-widget{width:100%!important;max-width:560px}
.kv-stack{flex-direction:column!important;gap:32px!important}
.kv-steps{width:100%!important}
.kv-grid2{width:100%}
}
@media (max-width: 860px){
.kv-nav{display:none!important}
.kv-grid3{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.kv-band{grid-template-columns:minmax(0,1fr)!important;gap:28px!important}
.kv-h1{font-size:54px!important}
}
@media (max-width: 640px){
.kv-pad,.kv-bestand{padding:48px 16px 56px!important}
.kv-header{padding:0 16px!important;height:72px!important}
.kv-footer{padding:32px 16px!important;flex-direction:column!important;gap:16px!important}
.kv-h1{font-size:42px!important}
.kv-h2{font-size:34px!important}
.kv-h2b{font-size:26px!important}
.kv-card{padding:20px!important}
.alv-in{font-size:16px!important}
.kv-logo{font-size:20px!important;letter-spacing:2px!important;white-space:nowrap}
.kv-cta{font-size:13px!important}
.kv-grid3,.kv-grid2{grid-template-columns:minmax(0,1fr)!important}
.kv-aside{padding:28px 20px 32px!important;gap:28px!important}
.kv-band{padding:24px 20px!important}
}
.kv-wrap,.kv-btns{flex-wrap:wrap}
.kv-btns>*{min-width:0}
.kv-sketch svg{max-width:88%;height:auto}
</style>
<style>html{scroll-behavior:smooth}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="kv-root" style="width: 100%; min-height: 100vh; background: #F6F4F0; display: flex; flex-direction: column;">

<header class="kv-header" style="height: 88px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E2DED6;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<div class="kv-logo" style="font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; letter-spacing: 3px;">KESSLER &amp; VOSS</div>
<div style="font-size: 11px; letter-spacing: 3px; color: #5E5B55;">AUTOMOBILE DÜSSELDORF</div>
</div>
<nav class="kv-nav" style="display: flex; gap: 40px; font-size: 14px; font-weight: 500;">
<a href="#bestand" style="text-decoration: none;">Bestand</a>
<a href="#bestand" style="text-decoration: none;">Fahrzeugsuche</a>
<a href="#bestand" style="text-decoration: none;">Ankauf</a>
<a href="#bestand" style="text-decoration: none;">Service</a>
<a href="#bestand" style="text-decoration: none;">Kontakt</a>
</nav>
<div class="kv-cta" style="font-size: 14px; font-weight: 500; white-space: nowrap;">Termin vereinbaren</div>
</header>

<section class="kv-pad" style="box-sizing: border-box; padding: 88px 80px 96px; display: flex; flex-direction: column;">
<div class="kv-hero" style="display: flex; gap: 96px; align-items: flex-start; min-height: 700px;">
<div class="kv-hero-text" style="flex-grow: 1; flex-basis: 0; padding-top: 48px; display: flex; flex-direction: column; gap: 28px;">
<div style="font-size: 12px; letter-spacing: 3px; color: #5E5B55; font-weight: 600;">EXKLUSIVE AUTOMOBILE</div>
<h1 class="kv-h1" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 76px; line-height: 1.02; letter-spacing: -0.5px;">Ihr nächstes Fahrzeug beginnt mit einer Anfrage.</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #45423D; max-width: 520px;">Nennen Sie Modell und Preisvorstellung. Unsere Fahrzeugsuche prüft den Bestand und verhandelt die Konditionen direkt für Sie.</p>
<div class="kv-wrap" style="display: flex; gap: 48px; padding-top: 24px; border-top: 1px solid #E2DED6; max-width: 520px;">
<div style="display: flex; flex-direction: column; gap: 4px;"><div style="font-size: 13px; color: #5E5B55;">Showroom</div><div style="font-size: 15px; font-weight: 500;">[ADRESSE]</div></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><div style="font-size: 13px; color: #5E5B55;">Öffnungszeiten</div><div style="font-size: 15px; font-weight: 500;">[ÖFFNUNGSZEITEN]</div></div>
</div>
</div>

<div class="kv-widget" id="suche" style="width: 520px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; font-family: Nunito, sans-serif; scroll-margin-top: 24px; min-height: {{slotH}}px;">
<sc-if value="{{isModal}}" hint-placeholder-val="{{false}}"><div onClick="{{closeModal}}" aria-hidden="true" style="position: fixed; inset: 0; z-index: 1000; background: rgba(10,22,40,.55);"></div></sc-if>
<div role="{{panelRole}}" aria-modal="{{panelModal}}" aria-label="Fahrzeugsuche" style="{{panelStyle}}">
<div class="kv-card" style="background: #FFFFFF; border: 1px solid #E4E6EB; border-radius: 16px; padding: 28px; box-shadow: 0 1px 2px rgba(10,22,40,.04), 0 8px 24px rgba(10,22,40,.06); display: flex; flex-direction: column; gap: 22px; color: #0A1628;">

<div style="display: flex; align-items: center; justify-content: space-between;">
<div style="font-size: 20px; font-weight: 800;">Fahrzeugsuche</div>
<div style="display: flex; align-items: center; gap: 14px;">
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #4A5468;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #1E9E63; display: inline-block;"></span>AI-Agent aktiv</div>
<sc-if value="{{isModal}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{closeModal}}" aria-label="Schließen" style="width: 44px; height: 44px; margin: -10px -10px -10px 0; border: 0; border-radius: 10px; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A1628" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></sc-if>
</div>
</div>

<div style="display: flex; gap: 6px;">
<sc-for list="{{stepBar}}" as="s" hint-placeholder-count="3">
<div style="{{s.style}}"></div>
</sc-for>
</div>

<sc-if value="{{isInput}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 18px;">
<div style="font-size: 15px; line-height: 1.5; color: #4A5468;">Beschreiben Sie Ihr Wunschfahrzeug. Der Agent prüft den Bestand und verhandelt für Sie.</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="alv-q" style="font-size: 13px; font-weight: 700;">Welches Fahrzeug suchen Sie?</label>
<input id="alv-q" class="alv-in" placeholder="z. B. Porsche 911 GT3, ab 2022, wenig Kilometer" value="{{query}}" onChange="{{onQuery}}">
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="font-size: 12px; font-weight: 600; color: #4A5468;">Beispiele</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{examples}}" as="ex" hint-placeholder-count="4">
<button type="button" class="alv-chip" onClick="{{ex.pick}}" style="{{ex.style}}">{{ex.label}}</button>
</sc-for>
</div>
</div>
<button type="button" class="alv-btn" onClick="{{goBudget}}" style="height: 50px; border: 0; border-radius: 10px; background: #0A1628; color: #FFFFFF; font: 700 15px Nunito, sans-serif;">Weiter</button>
</div>
</sc-if>

<sc-if value="{{isBudget}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: #F5F6F8; border-radius: 10px;">
<div style="font-size: 12px; font-weight: 600; color: #4A5468;">Produktart erfasst</div>
<div style="font-size: 15px; font-weight: 700;">{{query}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="font-size: 13px; font-weight: 700;">Ihre Preisvorstellung in Euro</div>
<div style="display: flex; gap: 12px; align-items: center;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;"><label for="alv-min" style="font-size: 12px; color: #4A5468;">von</label><input id="alv-min" class="alv-in" value="{{min}}" onChange="{{onMin}}"></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;"><label for="alv-max" style="font-size: 12px; color: #4A5468;">bis</label><input id="alv-max" class="alv-in" value="{{max}}" onChange="{{onMax}}"></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="font-size: 13px; font-weight: 700;">Zeitrahmen</div>
<div class="kv-wrap" style="display: flex; gap: 8px;">
<sc-for list="{{timings}}" as="t" hint-placeholder-count="3">
<button type="button" class="alv-chip" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>
<sc-if value="{{priceError}}" hint-placeholder-val="{{false}}">
<div style="font-size: 13px; font-weight: 700; color: #9B1C2C;">Bitte geben Sie eine Preisvorstellung an.</div>
</sc-if>
<div class="kv-btns" style="display: flex; gap: 10px;">
<button type="button" class="alv-chip" onClick="{{reset}}" style="height: 50px; padding: 0 20px; border: 1px solid #D9DCE3; border-radius: 10px; background: #FFFFFF; color: #0A1628; font: 700 15px Nunito, sans-serif;">Zurück</button>
<button type="button" class="alv-btn" onClick="{{startSearch}}" style="flex-grow: 1; height: 50px; border: 0; border-radius: 10px; background: #0A1628; color: #FFFFFF; font: 700 15px Nunito, sans-serif;">Suche und Verhandlung starten</button>
</div>
</div>
</sc-if>

<sc-if value="{{isWorking}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<div style="font-size: 15px; color: #4A5468;">Der Agent arbeitet an Ihrer Anfrage.</div>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border: 1px solid #E4E6EB; border-radius: 12px;">
<sc-for list="{{progressItems}}" as="p" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px;">
<div style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
<sc-if value="{{p.done}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#0A1628"></circle><path d="M6 10.2l2.6 2.6L14 7.4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
<sc-if value="{{p.active}}" hint-placeholder-val="{{false}}"><div class="alv-spin"></div></sc-if>
<sc-if value="{{p.todo}}" hint-placeholder-val="{{false}}"><div style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #D9DCE3; box-sizing: border-box;"></div></sc-if>
</div>
<div style="{{p.textStyle}}">{{p.label}}</div>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isFit}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
<span style="{{pillStyle}}">{{pill}}</span>
<span style="font-size: 13px; color: #4A5468;">{{pillNote}}</span>
</div>
<div style="border: 1px solid #E4E6EB; border-radius: 12px; overflow: hidden;">
<div style="height: 168px; background: #ECEAE5; display: flex; align-items: center; justify-content: center;"><sc-if value="{{car.isCoupe}}" hint-placeholder-val="{{true}}"><svg width="250" viewBox="0 0 320 130" fill="none" aria-hidden="true"><ellipse cx="162" cy="122" rx="146" ry="5" fill="#DEDAD2"></ellipse><path d="M20 100 L24 88 C30 80 60 76 96 73 L128 54 C148 43 196 41 224 51 L258 71 C284 74 300 80 304 92 L304 100" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M20 100 L60 100 A18 18 0 0 1 96 100 L228 100 A18 18 0 0 1 264 100 L304 100" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M112 71 L136 55 C154 47 192 46 214 54 L236 71 Z" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M172 72 V98" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M286 82 L298 84" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="78" cy="102" r="14" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></circle><circle cx="78" cy="102" r="5" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></circle><circle cx="246" cy="102" r="14" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></circle><circle cx="246" cy="102" r="5" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></circle></svg></sc-if><sc-if value="{{car.isSuv}}" hint-placeholder-val="{{false}}"><svg width="250" viewBox="0 0 320 130" fill="none" aria-hidden="true"><ellipse cx="162" cy="124" rx="148" ry="5" fill="#DEDAD2"></ellipse><path d="M18 104 L20 80 C22 70 34 66 60 64 L88 36 C94 30 104 28 116 28 L236 28 C248 28 256 32 262 40 L286 64 C298 66 306 72 306 84 L306 104" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18 104 L58 104 A20 20 0 0 1 98 104 L226 104 A20 20 0 0 1 266 104 L306 104" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M98 62 L117 38 H176 V62 Z" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M184 38 H232 L254 62 H184 Z" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M180 66 V100" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M292 76 L302 76" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="78" cy="106" r="16" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></circle><circle cx="78" cy="106" r="6" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></circle><circle cx="246" cy="106" r="16" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></circle><circle cx="246" cy="106" r="6" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></circle></svg></sc-if><sc-if value="{{car.isBoxy}}" hint-placeholder-val="{{false}}"><svg width="250" viewBox="0 0 320 130" fill="none" aria-hidden="true"><ellipse cx="160" cy="124" rx="146" ry="5" fill="#DEDAD2"></ellipse><path d="M22 104 V58 C22 52 26 48 32 48 L62 48 L80 24 C82 20 86 18 92 18 L232 18 C238 18 242 22 244 28 L252 48 L290 50 C296 50 300 54 300 60 V104" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M22 104 L60 104 A20 20 0 0 1 100 104 L220 104 A20 20 0 0 1 260 104 L300 104" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M88 46 L98 26 H158 V46 Z" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M166 26 H234 L240 46 H166 Z" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M162 50 V100" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M22 70 H300" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M284 58 L296 58" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="80" cy="106" r="16" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></circle><circle cx="80" cy="106" r="6" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></circle><circle cx="240" cy="106" r="16" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></circle><circle cx="240" cy="106" r="6" stroke="#8C877D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></circle></svg></sc-if></div>
<div style="padding: 18px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="font-size: 18px; font-weight: 800;">{{car.name}}</div>
<div style="font-size: 13px; color: #4A5468;">{{car.specs}}</div>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 12px; border-top: 1px solid #EEF0F3;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 12px; color: #4A5468;">Ihre Vorstellung</div>
<div style="font-size: 15px; font-weight: 700;">{{rangeLabel}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end;">
<div style="font-size: 12px; color: #4A5468;">Preis des Händlers</div>
<div style="font-size: 24px; font-weight: 800;">{{car.priceLabel}}</div>
</div>
</div>
</div>
</div>
<div style="padding: 14px 16px; border-radius: 10px; background: #F5F6F8; font-size: 14px; line-height: 1.5;">{{fitHint}}</div>
<div class="kv-btns" style="display: flex; gap: 10px;">
<button type="button" class="alv-chip" onClick="{{reset}}" style="height: 50px; padding: 0 20px; border: 1px solid #D9DCE3; border-radius: 10px; background: #FFFFFF; color: #0A1628; font: 700 15px Nunito, sans-serif;">Neue Suche</button>
<button type="button" class="alv-btn" onClick="{{openChat}}" style="flex-grow: 1; height: 50px; border: 0; border-radius: 10px; background: #0A1628; color: #FFFFFF; font: 700 15px Nunito, sans-serif;">Account erstellen und Gespräch starten</button>
</div>
</div>
</sc-if>

<sc-if value="{{isPriceOff}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; align-items: center; gap: 8px;">
<span style="padding: 5px 10px; border-radius: 999px; background: #FCEBEC; color: #9B1C2C; font-size: 12px; font-weight: 800;">Preisrahmen passt nicht</span>
</div>
<div style="font-size: 15px; line-height: 1.55; color: #4A5468;">Das Fahrzeug steht im Bestand, Ihre Preisvorstellung liegt aber deutlich unter dem Rahmen von Kessler &amp; Voss. Ihre Anfrage bleibt aktiv und wird weiter abgeglichen, auch mit neuen Fahrzeugen.</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid #E4E6EB; border-radius: 12px;">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: #0A1628;"><div class="alv-pulse"></div>Anfrage bleibt aktiv</div>
<div style="display: flex; justify-content: space-between; gap: 16px; font-size: 14px;"><span style="color: #4A5468;">Fahrzeug</span><span style="font-weight: 700; text-align: right;">{{query}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 16px; font-size: 14px;"><span style="color: #4A5468;">Preisvorstellung</span><span style="font-weight: 700;">{{rangeLabel}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 16px; font-size: 14px;"><span style="color: #4A5468;">Zeitrahmen</span><span style="font-weight: 700;">{{timingLabel}}</span></div>
</div>
<div class="kv-btns" style="display: flex; gap: 10px;">
<button type="button" class="alv-chip" onClick="{{reset}}" style="height: 50px; padding: 0 20px; border: 1px solid #D9DCE3; border-radius: 10px; background: #FFFFFF; color: #0A1628; font: 700 15px Nunito, sans-serif;">Neue Suche</button>
<button type="button" class="alv-btn" onClick="{{createAccount}}" style="flex-grow: 1; height: 50px; border: 0; border-radius: 10px; background: #0A1628; color: #FFFFFF; font: 700 15px Nunito, sans-serif;">Account erstellen und Anfrage sichern</button>
</div>
</div>
</sc-if>

<sc-if value="{{isChat}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; align-items: center; gap: 8px;">
<span style="padding: 5px 10px; border-radius: 999px; background: #E6F4EC; color: #11643D; font-size: 12px; font-weight: 800;">Account erstellt</span>
<span style="font-size: 13px; color: #4A5468;">Anfrage übernommen</span>
</div>
<div style="border: 1px solid #E4E6EB; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #EEF0F3;">
<div style="font-size: 14px; font-weight: 800;">{{car.name}}</div>
<div style="font-size: 13px; font-weight: 700; color: #4A5468;">Kessler &amp; Voss</div>
</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #FAFBFC;">
<div style="font-size: 12px; line-height: 1.5; color: #4A5468; text-align: center; padding: 0 12px;">Ihre Anfrage ist mit diesem Fahrzeug verknüpft. Kontaktdaten werden erst geteilt, wenn Sie zustimmen.</div>
<div style="align-self: flex-start; max-width: 82%; padding: 12px 14px; border-radius: 12px 12px 12px 4px; background: #FFFFFF; border: 1px solid #E4E6EB; font-size: 14px; line-height: 1.5;">Guten Tag, Ihre Anfrage zum {{car.name}} liegt uns vor. Das Fahrzeug steht bei uns im Showroom. Wann möchten Sie es sich ansehen?</div>
<div style="align-self: flex-end; max-width: 82%; padding: 12px 14px; border-radius: 12px 12px 4px 12px; background: #0A1628; color: #FFFFFF; font-size: 14px; line-height: 1.5;">Diese Woche, am liebsten Donnerstag.</div>

<div style="padding: 12px 16px; border-top: 1px solid #EEF0F3; display: flex; align-items: center; gap: 10px;">
<label for="alv-msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Nachricht</label>
<input id="alv-msg" class="alv-in" placeholder="Nachricht schreiben …" style="height: 42px;">
</div>
</div>
<div class="kv-btns" style="display: flex; gap: 10px;">
<button type="button" class="alv-chip" onClick="{{reset}}" style="height: 50px; padding: 0 20px; border: 1px solid #D9DCE3; border-radius: 10px; background: #FFFFFF; color: #0A1628; font: 700 15px Nunito, sans-serif;">Neue Suche</button>

</div>
